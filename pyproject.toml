[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokendrain"
version = "0.1.0"
description = "Persistent projects, disposable autonomous Codex microVMs"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3", "alembic>=1.14,<2", "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1", "cryptography>=44", "PyJWT[crypto]>=2.10,<3",
  "croniter>=6,<7", "python-dotenv>=1,<2", "python-multipart>=0.0.20",
]

[project.scripts]
tokendraind = "tokendrain.cli.daemon:main"
tokendrain = "tokendrain.cli.admin:main"
tokendrain-guestd = "tokendrain_guestd.main:main"
tokendrain-helper = "tokendrain.vm.helper:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.14", "types-croniter", "asgi-lifespan>=2"]

[tool.hatch.build.targets.wheel]
packages = ["src/tokendrain", "src/tokendrain_guestd"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tokendrain", "tokendrain_guestd"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["kvm: requires configured Linux KVM host", "nix: requires Nix build support"]
